<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检测报告</title>
    <style>
        body { 
            background-color: #f5f5f5; /* 加一点极其浅的灰色背景，让 PDF 显得更立体 */
            margin: 10px; /* 四周留出正常的网页边距，不再强行顶着屏幕边缘 */
            font-family: sans-serif;
        }
        iframe { 
            width: 100%; 
            height: 90vh; /* 高度给够，但留有余地 */
            border: 1px solid #ddd; /* 给 PDF 加一个很细的边框 */
            border-radius: 6px; /* 边框四个角稍微圆润一点点 */
            background-color: #fff;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <iframe src="report.pdf"></iframe>
</body>
</html>
