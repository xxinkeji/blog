<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 下面这行就是控制手机端显示比例的 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 重点来了！这里就是你想要的顶部标题 -->
    <title>扫码查看报告</title>
    <style>
        /* 去除页面默认白边，让图片完美贴合屏幕 */
        body { margin: 0; padding: 0; background-color: #f2f2f2; text-align: center; }
        /* 保证图片宽度100%，自适应手机屏幕 */
        img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>
    <!-- 把 src 里面的名字换成你实际上传的图片名字 -->
    <img src="jiance3.png" alt="检测报告">
</body>
</html>
